name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string
      release_note:
        description: 'Short release note shown in the update prompt'
        required: true
        type: string

jobs:
  publish:
    environment: release
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup pnpm
        run: npm install --global pnpm@12.3.4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release commit is current main
        shell: bash
        run: |
          git fetch origin main
          release_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          main_sha="$(git rev-parse origin/main)"
          test "$release_sha" = "$main_sha"

      - name: Audit frontend dependencies
        run: pnpm audit --audit-level high

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Determine tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
          else
            tag="$REF_NAME"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          expected="v$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [ "$tag" != "$expected" ]; then
            echo "Release tag $tag does not match package version $expected" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Determine release note
        id: release_note
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_NOTE: ${{ inputs.release_note }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            note="$INPUT_RELEASE_NOTE"
          else
            remote_tag_ref="refs/release-tags/$RELEASE_TAG"
            git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:$remote_tag_ref"
            note="$(git for-each-ref --format='%(contents)' "$remote_tag_ref")"
          fi
          {
            echo 'note<<RELEASE_NOTE_EOF'
            echo "$note"
            echo 'RELEASE_NOTE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: ${{ steps.tag.outputs.tag }}
          releaseBody: ${{ steps.release_note.outputs.note }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonKeepUniversal: true
          retryAttempts: 3
          args: --target x86_64-pc-windows-msvc
